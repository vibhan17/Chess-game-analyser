const CL={brilliant:['Brilliant','!!','#1baca6'],great:['Great','!','#5c8bb0'],best:['Best','★','#81b64c'],excellent:['Excellent','✓','#96bc4b'],good:['Good','✓','#a3b27a'],book:['Book','📖','#a88865'],inacc:['Inaccuracy','?!','#e6a817'],mistake:['Mistake','?','#e58f2a'],miss:['Miss','✕','#ff7769'],blunder:['Blunder','??','#ca3431']};

/* ---------- engine: 0x88 board, alpha-beta, iterative deepening ---------- */
const D={2:[31,33,18,14,-31,-33,-18,-14],3:[15,17,-15,-17],4:[1,-1,16,-16],5:[1,-1,16,-16,15,17,-15,-17],6:[1,-1,16,-16,15,17,-15,-17]};

function make(m){const f=m&127,t=m>>7&127,pr=m>>14&7,fl=m>>17&7,p=B[f],u=[B[t],ep,cas,K[0],K[1]];

for(let q=0;q<120;q++){if(q&136)continue;const p=B[q];if(!p)continue;const c=p>0?1:-1,t=c*p;if(t==6)continue;

const ix=n=>n.charCodeAt(0)-97+8*(n[1]-1),NM=i=>'abcdefgh'[i&7]+((i>>3)+1);
let G,cur=0,flip=false,sel=null,tg=new Map(),hint=false,busy=false,run=0,SQ=[],tm=0;const AN=new Map(),CM=new Map(),els=new Map();
function bookInfo(i){const pre=G.sans.slice(0,i).map(s=>s.replace(/[+#]/g,'')).join(' '),p=i?pre+' ':'';let inb=false,best=null;const nx={};
for(const e of OP){const m=e.m+' ';if(m.startsWith(p)){inb=true;if(m.length>p.length){const s=m.slice(p.length).split(' ')[0];if(!nx[s]||nx[s].m.length>e.m.length)nx[s]=e}}

if(L<=2&&af>=50&&b.best){const cc=new Chess(G.fens[i]);cc.move({from:b.best.from,to:b.best.to,promotion:b.best.promo});sac=mat(G.fens[i-1],c)-mat(cc.fen(),c)}
if(sac>=3&&L<=2&&af>=50)k='brilliant';
else if(L==0)k=a.alt==1&&a.n>1&&bf<80?'great':'best';
else k=L<=2?'excellent':L<=5?'good':L<=10?'inacc':L<=20?'mistake':'blunder';
if((k=='inacc'||k=='mistake')&&i>1&&(lossOf(i-1)||0)>=12)k='miss'}
CM.set(key,k);return k}
function stats(){const S=[{n:{},a:0,c:0},{n:{},a:0,c:0}];
for(let i=1;i<G.fens.length;i++){const k=kOf(i);if(!k)continue;const s=S[i%2?0:1],L=k=='book'?0:lossOf(i);s.n[k]=(s.n[k]||0)+1;s.a+=Math.max(0,Math.min(100,103.1668*Math.exp(-.04354*L)-3.1669));s.c++}
return S.map(s=>({...s,acc:s.c?s.a/s.c:null}))}
const tick=()=>new Promise(r=>setTimeout(r,30));
async function review(list){const my=++run;busy=true;ui();
for(const i of list){const f=G.fens[i];if(!f||AN.has(f))continue;await tick();if(my!=run)return;AN.set(f,think(f));ui()}
busy=false;ui()}
/* ---------- board ---------- */
const PG={p:'\u265F',n:'\u265E',b:'\u265D',r:'\u265C',q:'\u265B',k:'\u265A'};
const pos=s=>{const f=s&7,r=s>>3;return`translate(${(flip?7-f:f)*100}%,${(flip?r:7-r)*100}%)`};
function drawSq(){let h='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const f=flip?7-x:x,r=flip?y:7-y;
h+=`<div class="${(f+r)%2?'l':'d'}" data-i="${f+8*r}">${x==0?`<b style="left:3%;top:2%">${r+1}</b>`:''}${y==7?`<b style="right:4%;bottom:1%">${'abcdefgh'[f]}</b>`:''}</div>`}
$('sq').innerHTML=h;SQ=[];[...$('sq').children].forEach(c=>SQ[+c.dataset.i]=c)}
function mk(t){const e=document.createElement('div');e.className='p '+(t<'a'?'w':'b');e.textContent=PG[t.toLowerCase()]+'\uFE0E';e.dataset.t=t;return e}
function sync(fen){const w={};let r=7,f=0;for(const ch of fen.split(' ')[0]){if(ch=='/'){r--;f=0}else if(+ch)f+=+ch;else w[r*8+f++]=ch}
const orph=[];for(const[s,el]of els){if(w[s]==el.dataset.t)delete w[s];else{orph.push(el);els.delete(s)}}
for(const k in w){const s=+k,t=w[k];let bi=-1,bd=99;
orph.forEach((el,i)=>{if(el.dataset.t==t){const d=Math.abs((el.s&7)-(s&7))+Math.abs((el.s>>3)-(s>>3));if(d<bd){bd=d;bi=i}}});
let el;if(bi>=0){el=orph.splice(bi,1)[0];el.style.zIndex=3;setTimeout(()=>el.style.zIndex='',300);el.style.transform=pos(s)}
else{el=mk(t);el.style.transform=pos(s);el.style.opacity=0;$('pc').appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.opacity=1))}
el.s=s;els.set(s,el)}
orph.forEach(el=>{el.style.opacity=0;setTimeout(()=>el.remove(),260)})}
const arrow=b=>{const c=s=>{const i=ix(s),f=i&7,r=i>>3;return[(flip?7-f:f)*10+5,(flip?r:7-r)*10+5]},[x1,y1]=c(b.from),[x2,y2]=c(b.to);
return`<defs><marker id="ah" markerWidth="3" markerHeight="3" refX="1.2" refY="1.5" orient="auto"><path d="M0 0L3 1.5L0 3z" fill="#81b64c"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#81b64c" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>`};
/* ---------- panels ---------- */
function coach(){const fen=G.fens[cur],a=AN.get(fen),bi=bookInfo(cur),k=kOf(cur),pv=AN.get(G.fens[cur-1]);let h='';
if(cur){const s=G.sans[cur-1];h+=k?`<div class="row"><span class="ic big2" style="background:${CL[k][2]}">${CL[k][1]}</span><span><b>${s}</b> is ${NAME[k]}</span></div>`:`<div class="row"><b>${s}</b><span class="mu">${busy?'analyzing…':'not analyzed yet'}</span></div>`}
else h+='<div class="row"><b>Starting position</b></div>';
if(k&&!['best','great','brilliant','book'].includes(k)&&pv&&pv.best)h+=`<div>Best was <b>${pv.best.san}</b></div>`;
if(a)h+=`<div class="mu">Evaluation <b>${fmt(a.sc)}</b> · depth ${a.d||0}${a.best?` · engine suggests <b>${a.best.san}</b>`:''}</div>`;
h+=`<div style="margin-top:6px">Opening: <b>${bi.name||'—'}</b>${bi.inb||!cur?'':' <span class="mu">(left book)</span>'}</div>`;
if(bi.inb&&bi.nx.length)h+=`<div class="mu" style="margin-top:4px">Opening ideas from here:</div><div>${bi.nx.slice(0,6).map(([s,e])=>`<span class="ch" data-m="${s}">${s} · ${e.n}</span>`).join('')}</div>`;
return h}
function summary(S){const n=G.sans.length,have=G.fens.filter(f=>AN.has(f)).length,done=have==G.fens.length;
let h=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:16px">Game Review</b>${n&&!done&&!busy?'<button class="pr" data-a="rv">Review game</button>':''}</div>`;
if(busy)h+=`<div class="mu" style="margin-top:6px">Analyzing position ${have} of ${G.fens.length}…</div><div class="pb"><i style="width:${have/G.fens.length*100}%"></i></div>`;
if(!n)h+='<div class="mu" style="margin-top:4px">Tap a piece, then a square. Every move gets rated as you play.</div>';
if(S[0].c+S[1].c){h+=`<div class="acc">${[0,1].map(j=>`<div><div class="mu">${j?'Black':'White'} accuracy</div><div class="big">${S[j].acc==null?'–':S[j].acc.toFixed(1)}</div></div>`).join('')}</div><div class="cr mu"><span></span><span></span><span>White</span><span>Black</span></div>`;
for(const k of Object.keys(CL))if((S[0].n[k]||0)+(S[1].n[k]||0))h+=`<div class="cr"><span style="color:${CL[k][2]};font-weight:600">${CL[k][0]}</span><span class="ic" style="background:${CL[k][2]}">${CL[k][1]}</span><b>${S[0].n[k]||0}</b><b>${S[1].n[k]||0}</b></div>`}
return h}
function graph(){const n=G.fens.length,W=300,H=70,ps=G.fens.map(f=>{const a=AN.get(f);return a?wp(a.sc):null});
if(n<2||ps.filter(x=>x!=null).length<2)return'<div class="mu">The evaluation graph appears once the review runs.</div>';
let last=50;const xy=ps.map((p,i)=>{if(p!=null)last=p;return[(i*W/(n-1)).toFixed(1),(H-last*H/100).toFixed(1)]}),cx=cur*W/(n-1);
return`<svg id="gr" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:70px;display:block;border-radius:6px;background:#403d39;cursor:pointer"><path d="M0 ${H}L${xy.map(p=>p.join(' ')).join('L')}L${W} ${H}Z" fill="#fff"/><line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="#81b64c" stroke-width="2"/></svg>`}
function mlist(){const cell=p=>{const k=kOf(p);return`<span class="mv2${p==cur?' on':''}" data-go="${p}">${G.sans[p-1]}${k?`<span class="ic" style="background:${CL[k][2]}">${CL[k][1]}</span>`:''}</span>`};
if(!G.sans.length)return'<div class="mu">No moves yet.</div>';let h='';
for(let i=0;i<G.sans.length;i+=2)h+=`<div class="mr"><span class="mu">${i/2+1}.</span>${cell(i+1)}${G.sans[i+1]?cell(i+2):'<span></span>'}</div>`;return h}
function ui(){const fen=G.fens[cur],a=AN.get(fen),k=kOf(cur),S=stats();sync(fen);
SQ.forEach(e=>e.classList.remove('lm','sel','mv','cp'));
if(cur){const m=G.mvs[cur-1];SQ[ix(m.from)].classList.add('lm');SQ[ix(m.to)].classList.add('lm')}
if(sel!=null)SQ[sel].classList.add('sel');
tg.forEach((cap,i)=>{SQ[i].classList.add('mv');if(cap)SQ[i].classList.add('cp')});
const bg=$('bg');if(k){const m=G.mvs[cur-1];bg.style.transform=pos(ix(m.to));bg.style.opacity=1;bg.firstChild.textContent=CL[k][1];bg.firstChild.style.background=CL[k][2]}else bg.style.opacity=0;
let ar=null;if(hint&&a&&a.best)ar=a.best;else if(['inacc','mistake','miss','blunder'].includes(k)){const p=AN.get(G.fens[cur-1]);if(p&&p.best)ar=p.best}
$('ar').innerHTML=ar?arrow(ar):'';$('ht').classList.toggle('on',hint);
$('eb').classList.toggle('f',flip);$('ebi').style.height=(a?wp(a.sc):50)+'%';
const lab=w=>`<span>${w?'○':'●'} ${E((w?G.hd.White:G.hd.Black)||(w?'White':'Black'))}</span><span class="mu">${S[w?0:1].acc!=null?'Accuracy '+S[w?0:1].acc.toFixed(1):''}</span>`;
$('tp').innerHTML=lab(flip);$('bt').innerHTML=lab(!flip);
$('co').innerHTML=coach();$('su').innerHTML=summary(S);$('gp').innerHTML=graph();
const ml=$('ml');ml.innerHTML=mlist();const on=ml.querySelector('.on');if(on)ml.scrollTop=on.offsetTop-ml.clientHeight/2}
/* ---------- actions ---------- */
const stop=()=>{clearInterval(tm);tm=0;$('pp').textContent='▶'};
function go(i){cur=Math.max(0,Math.min(G.fens.length-1,i));sel=null;tg=new Map();ui()}
function setGame(sans,hd){const c=new Chess();G={fens:[c.fen()],sans:[],mvs:[],hd:hd||{}};
for(const s of sans){const m=c.move(s);if(!m)break;G.sans.push(m.san);G.mvs.push({from:m.from,to:m.to,uci:m.from+m.to+(m.promotion||'')});G.fens.push(c.fen())}
cur=0;sel=null;tg=new Map();hint=false;stop();ui();if(G.sans.length)review(G.fens.map((_,i)=>i))}
function play(f,t,san){const c=new Chess(G.fens[cur]),m=san?c.move(san):c.move({from:f,to:t,promotion:'q'});if(!m)return;
if(G.sans[cur]!==m.san){G.fens.length=cur+1;G.sans.length=cur;G.mvs.length=cur;G.fens.push(c.fen());G.sans.push(m.san);G.mvs.push({from:m.from,to:m.to,uci:m.from+m.to+(m.promotion||'')})}
go(cur+1);review([cur-1,cur])}
$('sq').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const i=+d.dataset.i;
if(sel!=null&&tg.has(i)){play(NM(sel),NM(i));return}
const c=new Chess(G.fens[cur]),p=c.get(NM(i));sel=null;tg=new Map();
if(p&&p.color==c.turn()){sel=i;c.moves({square:NM(i),verbose:true}).forEach(m=>tg.set(ix(m.to),!!m.captured))}ui()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-go],[data-m],#gr');if(!t)return;const a=t.dataset.a,L=G.fens.length-1;
if(t.id=='gr'){const r=t.getBoundingClientRect();return go(Math.round((e.clientX-r.left)/r.width*L))}
if(t.dataset.go)return go(+t.dataset.go);
if(t.dataset.m)return play(0,0,t.dataset.m);
if(a!='play')stop();
if(a=='first')go(0);else if(a=='prev')go(cur-1);else if(a=='next')go(cur+1);else if(a=='last')go(L);
else if(a=='play'){if(tm)stop();else{if(cur>=L)go(0);$('pp').textContent='⏸';tm=setInterval(()=>cur<G.fens.length-1?go(cur+1):stop(),900)}}
else if(a=='flip'){flip=!flip;drawSq();els.forEach((el,s)=>el.style.transform=pos(s));ui()}
else if(a=='hint'){hint=!hint;if(hint&&!AN.has(G.fens[cur]))review([cur]);else ui()}
else if(a=='rv')review(G.fens.map((_,i)=>i));
else if(a=='sm')setGame(SAMPLE.split(' '),{White:'Paul Morphy',Black:'Duke of Brunswick & Count Isouard'});
else if(a=='ng')setGame([]);
else if(a=='ld'){const c=new Chess();if(c.load_pgn($('pg').value.trim(),{sloppy:true})&&c.history().length){$('er').textContent='';setGame(c.history(),c.header())}else $('er').textContent='Could not read that PGN. Paste the full move list, for example “1. e4 e5 2. Nf3 Nc6”.'}});
document.addEventListener('keydown',e=>{if(e.target.tagName=='TEXTAREA')return;const L=G.fens.length-1;
if(e.key=='ArrowLeft')go(cur-1);else if(e.key=='ArrowRight')go(cur+1);else if(e.key=='Home')go(0);else if(e.key=='End')go(L)});
const SAMPLE='e4 e5 Nf3 d6 d4 Bg4 dxe5 Bxf3 Qxf3 dxe5 Bc4 Nf6 Qb3 Qe7 Nc3 c6 Bg5 b5 Nxb5 cxb5 Bxb5+ Nbd7 O-O-O Rd8 Rxd7 Rxd7 Rd1 Qe6 Bxd7+ Nxd7 Qb8+ Nxb8 Rd8#';
drawSq();setGame(SAMPLE.split(' '),{White:'Paul Morphy',Black:'Duke of Brunswick & Count Isouard'});
</script></body></html>
